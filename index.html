<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Belle Cosmetics | جمالك يبدأ هنا</title>
<style>
:root{--bg:#fdf6f7;--card:#fff;--text:#2a1f22;--muted:#7d6b70;--accent:#c2536f;--line:#f0dde1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171214;--card:#221a1d;--text:#f6eaed;--muted:#b09aa0;--accent:#e07a95;--line:#3a2b30}}
:root[data-theme="dark"]{--bg:#171214;--card:#221a1d;--text:#f6eaed;--muted:#b09aa0;--accent:#e07a95;--line:#3a2b30}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,"Segoe UI",Arial,sans-serif;line-height:1.6}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;letter-spacing:1px}.logo small{display:block;font-size:11px;color:var(--accent);font-weight:400}
button{font:inherit;cursor:pointer}
.cartbtn{background:var(--card);border:1px solid var(--line);color:var(--text);padding:8px 14px;border-radius:20px}
.hero{text-align:center;padding:48px 20px 32px}
.hero h1{margin:0 0 10px;font-size:28px}.hero p{color:var(--muted);max-width:520px;margin:0 auto}
h2{text-align:center;margin:24px 0 4px}.sub{text-align:center;color:var(--muted);margin:0 0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px;padding:0 18px 30px;max-width:1000px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.ph{aspect-ratio:3/4;background:var(--line)}.ph img{width:100%;height:100%;object-fit:cover;display:block}
.info{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.info h3{margin:0;font-size:16px}.info span{color:var(--muted);font-size:13px}
.price{color:var(--accent);font-weight:700}
.add{margin-top:auto;background:var(--accent);color:#fff;border:0;border-radius:10px;padding:9px}
.contact{text-align:center;padding:30px 18px;border-top:1px solid var(--line)}
.row{display:flex;gap:8px;justify-content:center;align-items:center;margin:8px 0;flex-wrap:wrap}
.row a{padding:6px 14px;border-radius:16px;border:1px solid var(--line);color:var(--text);text-decoration:none;background:var(--card)}
.wa{background:#25d366!important;color:#fff!important;border-color:#25d366!important}
#drawer{position:fixed;top:0;bottom:0;left:0;width:min(360px,100%);background:var(--bg);border-right:1px solid var(--line);transform:translateX(-100%);transition:.25s;z-index:10;display:flex;flex-direction:column;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
#drawer.open{transform:none}
#items{flex:1;overflow:auto}
.it{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);gap:8px}
.qty button{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--text)}
.total{display:flex;justify-content:space-between;font-weight:700;margin:12px 0}
.checkout{background:#25d366;color:#fff;border:0;border-radius:12px;padding:12px}
.x{align-self:flex-start;background:none;border:0;color:var(--text);font-size:24px}
.logo img{height:38px;width:auto}.logo span{line-height:1.2}.hero img{width:min(230px,60%);height:auto;display:block;margin:0 auto 14px}</style>
</head>

var cart={};
function $(i){return document.getElementById(i)}
$("grid").innerHTML=P.map(function(x,i){return '<div class="card"><div class="ph"><img src="'+x.i+'" alt="'+x.n+'"></div><div class="info"><h3>'+x.n+'</h3><span>'+x.d+'</span><div class="price">'+(x.p?x.p+' ج.م':'اسألي عن السعر')+'</div><button class="add" onclick="add('+i+')">أضيفي للسلة</button></div></div>'}).join("");
function add(i){cart[i]=(cart[i]||0)+1;render()}
function chg(i,d){cart[i]+=d;if(cart[i]<=0)delete cart[i];render()}
function toggle(o){$("drawer").classList.toggle("open",o)}
function render(){
  var k=Object.keys(cart),t=0,c=0;
  $("items").innerHTML=k.length?k.map(function(i){var q=cart[i];t+=q*P[i].p;c+=q;return '<div class="it"><span>'+P[i].n+'</span><span class="qty"><button onclick="chg('+i+',-1)">−</button> '+q+' <button onclick="chg('+i+',1)">+</button></span></div>'}).join(""):'<p class="sub">السلة فاضية</p>';
  $("cnt").textContent=c;$("tot").textContent=t?t+" ج.م":"—";
}
function send(){
  var k=Object.keys(cart);if(!k.length)return;
  var m="أهلاً، عايزة أطلب:\n"+k.map(function(i){return "- "+P[i].n+" × "+cart[i]}).join("\n");
  window.open("https://wa.me/"+WA+"?text="+encodeURIComponent(m),"_blank");
}
render();
